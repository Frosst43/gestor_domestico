name: Android - compilacion y pruebas

on:
  push:
    branches: [develop/android-v1-foundation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Una compilacion y una suite unitaria
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Guardar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: gestor-domestico-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
